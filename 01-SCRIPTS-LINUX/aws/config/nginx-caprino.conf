server {
    listen 80;
    listen [::]:80;

    server_name _;

    # Fotos de evidencia (bienestar, lineal, animales): hasta 12 MB por subida
    client_max_body_size 12m;

    # Compresion de la web y de las respuestas de la API
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    root /var/www/frontend;
    index index.html;

    # FRONTEND REACT
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos del frontend con nombre unico por version: cache larga
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API SYMFONY
    location ^~ /api/ {
        try_files $uri @symfony;
    }

    # SYMFONY FRONT CONTROLLER
    location @symfony {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/caprino/backend-symfony/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/caprino/backend-symfony/public;

        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;

        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # No permitir archivos ocultos
    location ~ /\. {
        deny all;
    }

    # Imagenes de Animales
    location /uploads/ {
        alias /var/www/caprino/backend-symfony/public/uploads/;
        try_files $uri =404;
    }

}
